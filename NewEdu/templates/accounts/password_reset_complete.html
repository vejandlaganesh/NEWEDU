{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete | NEWEDU</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2864d7;
            --primary-dark: #143b72;
            --text: #172033;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            min-height: 100vh;
            margin: 0;
            padding: 28px;
            background:
                radial-gradient(circle at 10% 10%, rgba(255, 255, 255, .9), transparent 30%),
                linear-gradient(135deg, #edf4ff 0%, #dfeaff 48%, #f7faff 100%);
            color: var(--text);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        a {
            text-decoration: none !important;
        }

        a:hover {
            text-decoration: underline !important;
        }

        .auth-container {
            width: min(480px, 100%);
            border: 1px solid rgba(111, 145, 190, .22);
            border-radius: 24px;
            background:
                radial-gradient(circle at 100% 0%, rgba(226, 238, 255, .72), transparent 34%),
                linear-gradient(145deg, #ffffff 0%, #f8fbff 100%);
            box-shadow:
                0 28px 70px rgba(37, 73, 120, .16),
                0 8px 24px rgba(37, 73, 120, .08);
            padding: 48px 44px;
            text-align: center;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 36px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            position: relative;
            flex-shrink: 0;
        }

        .logo-book {
            position: absolute;
            left: 4px;
            bottom: 4px;
            width: 38px;
            height: 28px;
            background: #123b75;
            border-radius: 4px 12px 6px 6px;
            transform: skewY(-4deg);
        }

        .logo-book::before {
            content: "";
            position: absolute;
            width: 17px;
            height: 24px;
            background: #2864d7;
            left: 2px;
            top: 2px;
            border-radius: 3px 10px 2px 2px;
        }

        .logo-book::after {
            content: "";
            position: absolute;
            width: 17px;
            height: 24px;
            background: #ffffff;
            right: 2px;
            top: 2px;
            border-radius: 10px 3px 2px 2px;
        }

        .graduation-cap {
            position: absolute;
            top: 2px;
            left: 10px;
            width: 26px;
            height: 14px;
            background: #143b72;
            clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
            z-index: 3;
        }

        .star {
            position: absolute;
            top: -4px;
            right: 1px;
            color: #f7b51d;
            font-size: 15px;
            z-index: 5;
        }

        .brand-name {
            color: #143b72;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        /* Success icon */

        .success-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-icon svg {
            width: 36px;
            height: 36px;
            stroke: #2e7d32;
            fill: none;
            stroke-width: 2.2;
        }

        .auth-heading h1 {
            color: #143b72;
            font-size: 24px;
            font-weight: 750;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }

        .auth-description {
            color: #687489;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Button */

        .submit-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 48px;
            padding: 0 32px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #2864d7, #2860ce);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 5px 12px rgba(40, 100, 215, .16);
            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }

        .submit-button:hover {
            box-shadow: 0 8px 18px rgba(40, 100, 215, .22);
            transform: translateY(-1px);
        }

        .submit-button svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
        }

        .auth-footer {
            margin-top: 32px;
            color: #8a95a8;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .auth-container {
                padding: 36px 24px;
                border-radius: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <!-- Brand -->
        <div class="brand">
            <div class="brand-logo">
                <div class="star">★</div>
                <div class="graduation-cap"></div>
                <div class="logo-book"></div>
            </div>
            <div class="brand-name">NEWEDU</div>
        </div>

        <!-- Success Icon -->
        <div class="success-icon">
            <svg viewBox="0 0 32 32">
                <path d="M9 16l4 4 10-10" />
            </svg>
        </div>

        <div class="auth-heading">
            <h1>Password Reset Complete</h1>
        </div>

        <p class="auth-description">
            Your password has been successfully set.<br>
            You may go ahead and log in now.
        </p>

        <a href="{% url 'accounts:login' %}" class="submit-button">
            <svg viewBox="0 0 32 32">
                <path d="M15 8l-7 8 7 8" />
                <path d="M8 16h16" />
            </svg>
            Continue to Login
        </a>

        <div class="auth-footer">
            © 2026 NEWEDU. All rights reserved.
        </div>

    </div>

</body>

</html>
