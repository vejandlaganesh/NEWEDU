{% extends 'teachers/teacher_base.html' %}
{% block title %}Create Quiz - NEWEDU{% endblock %}
{% block teacher_content %}
<h2>Create Quiz</h2>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Save Quiz</button>
        <a href="{% url 'teacher_quizzes' %}" class="btn" style="background-color: #6c757d;">Cancel</a>
    </form>
</div>
{% endblock %}
