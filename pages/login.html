<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewEdu - Login</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div class="container">

        <!-- Left Section -->
        <div class="left">
            <h1>NewEdu</h1>

            <p>
                Learn Smarter.<br>
                Build Skills.<br>
                Shape Your Future.
            </p>

            <img src="../assets/login-illustration.svg"
                alt="Illustration of an open book and a graduation cap">
        </div>

        <!-- Right Section -->
        <div class="right">

            <div class="login-box">

                <h2>Welcome Back 👋</h2>
                <p>Login to continue learning.</p>

                <form id="loginForm" novalidate>

                    <!-- Email -->
                    <div class="input-box">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <!-- Password -->
                    <div class="input-box">

                        <label for="password">Password</label>

                        <div class="password-wrap">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required>

                            <button
                                type="button"
                                class="toggle-password"
                                id="togglePassword"
                                aria-label="Show password">

                                <svg class="eye-icon"
                                    viewBox="0 0 24 24"
                                    width="20"
                                    height="20"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round">

                                    <path
                                        d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z">
                                    </path>

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3">
                                    </circle>

                                </svg>

                            </button>

                        </div>

                    </div>

                    <!-- Options -->
                    <div class="options">

                        <label>
                            <input type="checkbox">
                            Remember Me
                        </label>

                        <a href="#">Forgot Password?</a>

                    </div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="login-btn"
                        id="loginBtn">

                        Login

                    </button>

                    <!-- Message -->
                    <p id="message"
                        style="margin-top:15px;color:red;text-align:center;">
                    </p>

                </form>

                <!-- Signup -->
                <div class="signup">

                    Don't have an account?

                    <a href="signup.html">Sign Up</a>

                </div>

            </div>

        </div>

    </div>

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const togglePassword = document.getElementById("togglePassword");
            const passwordField = document.getElementById("password");

            togglePassword.addEventListener("click", () => {

                const isVisible = passwordField.type === "text";

                passwordField.type = isVisible ? "password" : "text";

                togglePassword.setAttribute(
                    "aria-label",
                    isVisible ? "Show password" : "Hide password"
                );

            });

            const loginBtn = document.getElementById("loginBtn");

            loginBtn.addEventListener("click", (e) => {

                const rect = loginBtn.getBoundingClientRect();

                const ripple = document.createElement("span");

                const size = Math.max(rect.width, rect.height);

                ripple.className = "ripple";

                ripple.style.width = ripple.style.height = `${size}px`;

                ripple.style.left = `${e.clientX - rect.left - size / 2}px`;

                ripple.style.top = `${e.clientY - rect.top - size / 2}px`;

                loginBtn.appendChild(ripple);

                setTimeout(() => ripple.remove(), 600);

            });

            const loginForm = document.getElementById("loginForm");
            const message = document.getElementById("message");

            loginForm.addEventListener("submit", async (e) => {

                e.preventDefault();

                const email = document.getElementById("email").value.trim();

                const password = document.getElementById("password").value;

                message.textContent = "";

                try {

                    const response = await fetch("http://localhost:3000/login", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email,
                            password
                        })

                    });

                    const data = await response.json();

                    if (data.success) {

                        window.location.href = "../index.html";

                    } else {

                        message.textContent =
                            data.message || "Login failed. Please check your credentials.";

                    }

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to the server.";

                }

            });

        });

    </script>

</body>

</html>
